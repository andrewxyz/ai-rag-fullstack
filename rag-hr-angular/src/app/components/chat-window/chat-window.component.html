<div class="flex flex-col h-full">

  <!-- Messages list -->
  <div
    #messageList
    class="flex-1 overflow-y-auto px-4 py-4 space-y-1 scrollbar-thin">
    @for (msg of messages(); track msg.id) {
      <app-message-bubble [message]="msg" />
    }
  </div>

  <!-- Input bar -->
  <div class="border-t border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-900 px-4 py-3">
    <div class="flex items-end gap-2 max-w-4xl mx-auto">
      <textarea
        [(ngModel)]="inputText"
        (keydown)="onKeyDown($event)"
        [disabled]="isLoading()"
        placeholder="Ask about HR policies…"
        rows="1"
        class="flex-1 resize-none rounded-xl border border-gray-300 dark:border-gray-600
               bg-gray-50 dark:bg-gray-800 text-gray-800 dark:text-gray-100
               px-4 py-2.5 text-sm
               focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent
               disabled:opacity-60
               placeholder:text-gray-400 dark:placeholder:text-gray-500
               max-h-32 overflow-y-auto">
      </textarea>
      <button
        (click)="sendMessage()"
        [disabled]="!inputText.trim() || isLoading()"
        class="flex-shrink-0 w-10 h-10 rounded-xl bg-indigo-600 hover:bg-indigo-700
               disabled:opacity-40 disabled:cursor-not-allowed
               text-white flex items-center justify-center transition-colors">
        @if (isLoading()) {
          <span class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
        } @else {
          <span class="text-base">→</span>
        }
      </button>
    </div>
    <p class="text-center text-xs text-gray-400 dark:text-gray-500 mt-1.5">Enter to send · Shift+Enter for new line</p>
  </div>

</div>
