<div class="flex h-screen bg-gray-100 dark:bg-gray-950 overflow-hidden">

  <!-- Mobile backdrop -->
  @if (sidebarOpen()) {
    <div
      class="fixed inset-0 bg-black/50 z-40 md:hidden"
      (click)="closeSidebar()">
    </div>
  }

  <!-- Sidebar -->
  <!-- Desktop: always visible static panel -->
  <!-- Mobile: absolute overlay, slides in when sidebarOpen() is true -->
  <aside [class]="'z-50 bg-white dark:bg-gray-900 border-r border-gray-200 dark:border-gray-700 flex flex-col w-72 flex-shrink-0 ' +
    'md:relative md:translate-x-0 md:flex ' +
    (sidebarOpen()
      ? 'fixed inset-y-0 left-0 translate-x-0 transition-transform duration-300'
      : 'fixed inset-y-0 left-0 -translate-x-full md:translate-x-0 transition-transform duration-300')">
    <app-knowledge-sidebar (close)="closeSidebar()" />
  </aside>

  <!-- Main area -->
  <div class="flex flex-col flex-1 min-w-0">

    <!-- Header -->
    <header class="flex items-center justify-between px-4 py-3 bg-white dark:bg-gray-900 border-b border-gray-200 dark:border-gray-700">
      <div class="flex items-center gap-3">
        <!-- KB toggle (always shown, sidebar toggle on all sizes) -->
        <button
          (click)="openSidebar()"
          class="p-2 rounded-lg text-gray-500 hover:text-indigo-600 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors"
          aria-label="Open knowledge base">
          📚
        </button>
        <div class="flex items-center gap-2">
          <span class="text-lg font-bold text-indigo-600">🤖</span>
          <span class="font-semibold text-gray-800 dark:text-gray-100 text-sm md:text-base">HR Policy Assistant</span>
        </div>
      </div>

      <!-- Dark mode toggle -->
      <button
        (click)="toggleDark()"
        class="p-2 rounded-lg text-gray-500 hover:text-gray-800 dark:hover:text-gray-100 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors"
        [attr.aria-label]="darkMode() ? 'Switch to light mode' : 'Switch to dark mode'">
        {{ darkMode() ? '☀️' : '🌙' }}
      </button>
    </header>

    <!-- Chat window fills remaining space -->
    <main class="flex-1 overflow-hidden bg-gray-50 dark:bg-gray-950">
      <app-chat-window />
    </main>

  </div>
</div>
